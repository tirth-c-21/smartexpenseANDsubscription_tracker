services:
  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "9090:9090"
    depends_on:
      - postgres
    networks:
      - s-network
    environment:
     SERVER_PORT: 9090
     JWT_SECRET: ${JWT_SECRET}
     JWT_EXPIRATION: ${JWT_EXPIRATION}
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/SExpenseTrackerDatabase
     SPRING_DATASOURCE_USERNAME: postgres
     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
     SPRING_MAIL_HOST: smtp.gmail.com
     SPRING_MAIL_PORT: 587
     SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
     SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
  expense_service:
    build: ./expense_service
    container_name: expense_service
    ports:
      - "9091:9091"
    depends_on:
      - postgres
    networks:
      - s-network
    environment:
     SERVER_PORT: 9091
     JWT_SECRET: ${JWT_SECRET}
     JWT_EXPIRATION: ${JWT_EXPIRATION}
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/SExpenseTrackerDB_Expenseservice
     SPRING_DATASOURCE_USERNAME: postgres
     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
     SPRING_MAIL_HOST: smtp.gmail.com
     SPRING_MAIL_PORT: 587
     SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
     SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
  subscription_service:
    build: ./subscription_service
    container_name: subscription_service
    ports:
      - "9093:9093"
    depends_on:
      - postgres
      - kafka
    networks:
      - s-network
    environment:
     SERVER_PORT: 9093
     JWT_SECRET: ${JWT_SECRET}
     JWT_EXPIRATION: ${JWT_EXPIRATION}
     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/SExpenseTrackerDB_subscriptionservice
     SPRING_DATASOURCE_USERNAME: postgres
     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
     SPRING_MAIL_HOST: smtp.gmail.com
     SPRING_MAIL_PORT: 587
     SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
     SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9095
  notification_service:
    build: ./notification_service
    container_name: notification_service
    ports:
      - "9094:9094"
    depends_on:
      - kafka
    networks:
      - s-network
    environment:
     SERVER_PORT: 9094
     JWT_SECRET: ${JWT_SECRET}
     JWT_EXPIRATION: ${JWT_EXPIRATION}
     SPRING_MAIL_HOST: smtp.gmail.com
     SPRING_MAIL_PORT: 587
     SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
     SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
     SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9095
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: ${DB_PASSWORD}
     POSTGRES_DB: SExpenseTrackerDatabase
    ports:
     - "5433:5432"
    volumes:
     - postgres-s-data:/var/lib/postgresql/data
     - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    networks:
     - s-network
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    ports:
     - "9092:9092"
    environment:
     KAFKA_NODE_ID: 1
     KAFKA_PROCESS_ROLES: broker,controller
     KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9095
     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:9095
     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
     KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    networks:
     - s-network


networks:
  s-network:
    driver: bridge

volumes:
  postgres-s-data: